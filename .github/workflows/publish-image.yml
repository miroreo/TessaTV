name: Publish image

# Builds docker/Dockerfile and pushes it to ghcr.io/<owner>/<repo> (see docs/DEPLOYMENT.md).
# Pushes to master publish `latest` + `sha-<short>`; a `v*` tag publishes semver tags.
# Pull requests only build, to catch Dockerfile breakage without publishing.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    paths:
      - docker/Dockerfile
      - .dockerignore
      - pnpm-lock.yaml
      - '**/package.json'
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the repository name, which ghcr requires.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
